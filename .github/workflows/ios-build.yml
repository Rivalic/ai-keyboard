name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    
    - name: Show Xcode Version
      run: xcodebuild -version
    
    - name: Install Apple Certificate and Provisioning Profile
      if: ${{ github.event_name != 'pull_request' }}
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Import certificate and provisioning profile from secrets
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Apply provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
      continue-on-error: true
    
    - name: Build App (Unsigned for Testing)
      run: |
        xcodebuild clean archive \
          -project AIKeyboard.xcodeproj \
          -scheme AIKeyboard \
          -configuration Release \
          -archivePath $RUNNER_TEMP/AIKeyboard.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
      continue-on-error: true
    
    - name: Create IPA (Alternative Method)
      run: |
        # Try building without signing for demonstration
        xcodebuild \
          -project AIKeyboard.xcodeproj \
          -scheme AIKeyboard \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
        
        # Create Payload directory
        mkdir -p Payload
        
        # Find the .app file
        APP_PATH=$(find DerivedData -name "*.app" | head -n 1)
        
        if [ -n "$APP_PATH" ]; then
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Create IPA
          zip -r AIKeyboard-unsigned.ipa Payload
          
          echo "✅ IPA created successfully!"
          ls -lh AIKeyboard-unsigned.ipa
        else
          echo "❌ Could not find .app file"
        fi
      continue-on-error: true
    
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIKeyboard-IPA
        path: |
          AIKeyboard-unsigned.ipa
          *.ipa
        retention-days: 30
      continue-on-error: true
    
    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          DerivedData/Logs
          *.log
        retention-days: 7
      continue-on-error: true
    
    - name: Clean up Keychain
      if: ${{ always() }}
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
      continue-on-error: true
    
    - name: Build Summary
      if: always()
      run: |
        echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: Check artifacts above" >> $GITHUB_STEP_SUMMARY
        echo "- **Xcode Version**: $(xcodebuild -version | head -n 1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Runner OS**: macOS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download IPA" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to the 'Artifacts' section above" >> $GITHUB_STEP_SUMMARY
        echo "2. Download 'AIKeyboard-IPA'" >> $GITHUB_STEP_SUMMARY
        echo "3. Extract and install using AltStore or similar" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⚠️ Note" >> $GITHUB_STEP_SUMMARY
        echo "This IPA is unsigned and for testing only." >> $GITHUB_STEP_SUMMARY
        echo "For a signed IPA, add your Apple Developer certificates to GitHub Secrets." >> $GITHUB_STEP_SUMMARY
